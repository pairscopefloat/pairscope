name: Refresh Pairscope data

on:
  schedule:
    - cron: '17 * * * *'   # every hour at :17 (UTC); off the top of the hour, when GitHub is busiest
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - run: npx playwright install --with-deps chromium

      - name: Refresh data
        run: npm run refresh

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/data/pairscope.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "pairscope-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/pairscope.json
          git commit -m "Refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
